<!DOCTYPE html>
<!-- Standalone visual preview of the SF TeamFlow home webview (mock data).
     Not shipped in the extension; for design review / screenshots only. -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  :root {
    color-scheme: dark;
    --vscode-font-family: "Segoe UI", system-ui, sans-serif;
    --vscode-font-size: 13px;
    --vscode-foreground: #cccccc;
    --vscode-badge-background: #4d4d4d;
    --vscode-badge-foreground: #ffffff;
    --vscode-button-background: #0e639c;
    --vscode-button-foreground: #ffffff;
    --vscode-button-secondaryBackground: #3a3d41;
    --vscode-button-secondaryForeground: #ffffff;
    --vscode-panel-border: #5a5a5a55;
    --vscode-list-hoverBackground: #2a2d2e;
    --vscode-focusBorder: #2f9bff;
    --vscode-dropdown-background: #3c3c3c;
    --vscode-dropdown-foreground: #f0f0f0;
    --vscode-dropdown-border: #5a5a5a55;
    --vscode-activityBarBadge-background: #d33;
    --vscode-activityBarBadge-foreground: #fff;
    --vscode-inputValidation-errorBackground: #5a1d1d;
  }
  body { font-family: var(--vscode-font-family); font-size: var(--vscode-font-size); color: var(--vscode-foreground); padding: 8px 8px 24px; background: #1e1e1e; width: 320px; margin: 0 auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 13px; font-size: 11.5px; background: var(--vscode-badge-background); color: var(--vscode-badge-foreground); }
  .chip.prod { background: var(--vscode-inputValidation-errorBackground); outline: 1px solid #e55; }
  .hero { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 10px; background: var(--vscode-button-background); color: var(--vscode-button-foreground); cursor: pointer; margin-bottom: 12px; }
  .hero .em { font-size: 26px; line-height: 1; }
  .hero .tx { flex: 1; }
  .hero .t1 { font-size: 11px; opacity: .85; }
  .hero .t2 { font-size: 14px; font-weight: 600; margin-top: 2px; }
  .hero .go { font-size: 18px; opacity: .85; }
  section { border: 1px solid var(--vscode-panel-border); border-radius: 10px; padding: 8px 8px 10px; margin-bottom: 10px; }
  .sechead { display: flex; align-items: center; gap: 8px; margin: 2px 2px 8px; }
  .stepno { width: 20px; height: 20px; border-radius: 50%; background: var(--vscode-badge-background); color: var(--vscode-badge-foreground); font-size: 11px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; font-weight: 600; }
  .sectitle { font-size: 12.5px; font-weight: 600; }
  .sechint { font-size: 11px; opacity: .6; margin-left: auto; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .grid.three { grid-template-columns: 1fr 1fr 1fr; }
  button.tile { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 11px 4px; border: 1px solid var(--vscode-panel-border); border-radius: 9px; background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground); cursor: pointer; font-size: 11.5px; line-height: 1.2; min-height: 58px; text-align: center; }
  button.tile.primary { outline: 2px solid var(--vscode-focusBorder); }
  button.tile .em { font-size: 19px; }
  button.tile:disabled { opacity: .35; cursor: default; }
  .badge { position: absolute; top: 5px; right: 7px; background: var(--vscode-activityBarBadge-background); color: var(--vscode-activityBarBadge-foreground); border-radius: 9px; padding: 0 6px; font-size: 11px; }
  .card { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border: 1px solid var(--vscode-panel-border); border-radius: 8px; margin-bottom: 6px; cursor: pointer; }
  .card.active { outline: 2px solid var(--vscode-focusBorder); }
  .card .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .card .name { flex: 1; font-size: 12.5px; }
  .card .cat { font-size: 10.5px; opacity: .6; }
  .card .open { font-size: 11px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--vscode-panel-border); background: transparent; color: var(--vscode-foreground); cursor: pointer; }
  .row { display: flex; gap: 6px; align-items: center; }
  select { flex: 1; padding: 6px; background: var(--vscode-dropdown-background); color: var(--vscode-dropdown-foreground); border: 1px solid var(--vscode-dropdown-border); border-radius: 6px; }
  .iconbtn { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--vscode-panel-border); background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground); cursor: pointer; white-space: nowrap; }
  details.changed { border: 1px solid var(--vscode-panel-border); border-radius: 9px; padding: 6px 10px; margin-bottom: 12px; }
  details.changed > summary { cursor: pointer; font-size: 12px; list-style: none; display: flex; align-items: center; gap: 6px; }
  details.changed > summary .caret { transition: transform .15s; opacity: .6; }
  details.changed[open] > summary .caret { transform: rotate(90deg); }
  .filelist { margin-top: 6px; }
  .fileitem { display: flex; align-items: center; gap: 7px; padding: 3px 2px; font-size: 11.5px; }
  .filetag { font-size: 10px; padding: 1px 6px; border-radius: 8px; background: var(--vscode-badge-background); color: var(--vscode-badge-foreground); flex: 0 0 auto; }
  .filepath { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .85; }
  details.more { margin: 2px 0 10px; }
  details.more > summary { cursor: pointer; font-size: 12.5px; padding: 8px 10px; border: 1px dashed var(--vscode-panel-border); border-radius: 8px; opacity: .85; list-style: none; }
  .addorg { margin-bottom: 8px; }
</style>
</head>
<body>
  <div id="status" class="chips"></div>
  <div id="hero"></div>
  <div id="changedbox"></div>
  <div id="sections"></div>
  <section><div class="sechead"><span class="stepno">🌿</span><span class="sectitle">作業ブランチ</span></div><div id="branchbox"></div></section>
  <section><div class="sechead"><span class="stepno">☁️</span><span class="sectitle">接続中の Org</span><span class="sechint">クリックで切替</span></div><div id="orgs"></div></section>
<script>
  const $ = (id) => document.getElementById(id);
  const SECTIONS = [
    { no:'1', title:'開発する', hint:'Orgと同期', tier:'core', tiles:[
      {c:'b',em:'⬇️',label:'Orgから取込',need:'org'},{c:'c',em:'⬆️',label:'Orgへ反映',need:'org'} ]},
    { no:'2', title:'保存する', hint:'バックアップ', tier:'core', tiles:[
      {c:'d',em:'💾',label:'保存してバックアップ',need:'repo',badge:'changes'},{c:'e',em:'🔄',label:'GitHubと同期',need:'remote',badge:'ahead'} ]},
    { no:'3', title:'テスト・リリース', hint:'品質確認', tier:'more', three:true, tiles:[
      {c:'t',em:'🧪',label:'テスト実行',need:'org'},{c:'f',em:'✅',label:'検証（お試し）',need:'repo',badge:'deploy'},{c:'g',em:'🚀',label:'デプロイ',need:'repo',badge:'deploy'} ]},
    { no:'4', title:'バージョン管理', hint:'ブランチ/タグ', tier:'more', tiles:[
      {c:'br',em:'🌿',label:'ブランチ管理',need:'repo'},{c:'tg',em:'🏷️',label:'タグ管理',need:'repo'} ]},
    { no:'⋯', title:'その他', hint:'', tier:'more', three:true, tiles:[
      {c:'h',em:'📥',label:'メタデータ取得',need:'org'},{c:'i',em:'🌱',label:'スクラッチ作成'},{c:'j',em:'📘',label:'ガイド'} ]},
  ];
  function nextAction(s){
    if(s.changes>0) return {em:'💾',t1:'次にやること',t2:'変更 '+s.changes+'件を保存してバックアップ',c:'d'};
    return {em:'✅',t1:'準備OK',t2:'変更を加えたらここに表示されます',calm:true};
  }
  function escapeHtml(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  function render(s){
    const chips=[];
    if(s.defaultOrg) chips.push('<span class="chip '+(s.defaultOrg.isProduction?'prod':'')+'">☁️ '+(s.defaultOrg.isProduction?'⚠️ ':'')+escapeHtml(s.defaultOrg.displayName)+'</span>');
    if(s.hasRepo){ let b='🌿 '+escapeHtml(s.branch); if(s.env) b+=' → '+escapeHtml(s.env.name); chips.push('<span class="chip">'+b+'</span>'); }
    $('status').innerHTML=chips.join('');
    const na=nextAction(s);
    $('hero').innerHTML='<div class="hero'+(na.calm?' calm':'')+'"><span class="em">'+na.em+'</span><span class="tx"><div class="t1">'+na.t1+'</div><div class="t2">'+escapeHtml(na.t2)+'</div></span>'+(na.c?'<span class="go">▶</span>':'')+'</div>';
    if(s.files&&s.files.length>0){ const rows=s.files.map(f=>'<div class="fileitem"><span class="filetag">'+escapeHtml(f.label)+'</span><span class="filepath">'+escapeHtml(f.path)+'</span></div>').join(''); $('changedbox').innerHTML='<details class="changed" open><summary><span class="caret">▶</span>📝 保存される変更 '+s.files.length+'件</summary><div class="filelist">'+rows+'</div></details>'; } else { $('changedbox').innerHTML=''; }
    function renderSec(sec){
      const tiles=sec.tiles.map(t=>{ let dis=false; if(t.need==='repo'&&!s.hasRepo)dis=true; if(t.need==='remote'&&!s.hasRemote)dis=true; if(t.need==='org'&&s.orgs.length===0)dis=true;
        let badge=''; if(t.badge==='changes'&&s.changes>0)badge='<span class="badge">'+s.changes+'</span>'; if(t.badge==='ahead'&&s.ahead>0)badge='<span class="badge">'+s.ahead+'</span>'; if(t.badge==='deploy'&&s.deployCount>0)badge='<span class="badge">'+s.deployCount+'</span>';
        return '<button class="tile '+(na.c===t.c?'primary':'')+'" '+(dis?'disabled':'')+'>'+badge+'<span class="em">'+t.em+'</span><span>'+escapeHtml(t.label)+'</span></button>'; }).join('');
      const hint=sec.hint?'<span class="sechint">'+sec.hint+'</span>':'';
      return '<section><div class="sechead"><span class="stepno">'+sec.no+'</span><span class="sectitle">'+sec.title+'</span>'+hint+'</div><div class="grid '+(sec.three?'three':'')+'">'+tiles+'</div></section>';
    }
    const core=SECTIONS.filter(x=>x.tier==='core').map(renderSec).join('');
    const more=SECTIONS.filter(x=>x.tier==='more').map(renderSec).join('');
    $('sections').innerHTML=core+'<details class="more"><summary>▸ もっと操作（テスト / デプロイ / タグ / Org追加）</summary>'+more+'</details>';
    const opts=s.branches.map(b=>'<option '+(b===s.branch?'selected':'')+'>'+escapeHtml(b)+'</option>').join('');
    $('branchbox').innerHTML='<div class="row"><select>'+opts+'</select><button class="iconbtn">＋ 新規</button></div>';
    const colors={Production:'#e5534b',Sandbox:'#4aa3df',DevHub:'#b07cf0',Scratch:'#3fb950',Other:'#888'};
    $('orgs').innerHTML='<button class="iconbtn addorg">＋ Orgを追加</button>'+s.orgs.map(o=>'<div class="card '+(o.isDefault?'active':'')+'"><span class="dot" style="background:'+(colors[o.category]||'#888')+'"></span><span class="name">'+(o.isDefault?'★ ':'')+escapeHtml(o.displayName)+(o.isProduction?' ⚠️':'')+'<div class="cat">'+o.category+'</div></span><button class="open">開く</button></div>').join('');
  }
  render({
    configured:true, hasRepo:true, hasRemote:true, changes:3, ahead:2, behind:0, deployCount:5,
    files:[
      {label:'変更', path:'force-app/main/default/classes/AccountController.cls'},
      {label:'新規', path:'force-app/main/default/lwc/accountSearch/accountSearch.js'},
      {label:'削除', path:'force-app/main/default/classes/OldHelper.cls'},
    ],
    branch:'feature/取引先検索', env:{name:'integration',type:'sandbox'},
    defaultOrg:{displayName:'dev-scratch', isProduction:false},
    branches:['main','develop','release/1.2','feature/取引先検索'],
    orgs:[
      {displayName:'本番組織 (prod)', category:'Production', isProduction:true, isDefault:false, connected:true},
      {displayName:'uat-sandbox', category:'Sandbox', isProduction:false, isDefault:false, connected:true},
      {displayName:'DevHub', category:'DevHub', isProduction:false, isDefault:false, connected:true},
      {displayName:'dev-scratch', category:'Scratch', isProduction:false, isDefault:true, connected:true},
    ],
  });
</script>
</body>
</html>
